name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time per branch; superseded pushes are cancelled.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # BUILD_REF is rendered on the landing page, so the deployed build can be
      # matched to the commit that produced it.
      - name: Build web
        run: flutter build web --release --dart-define=BUILD_REF=${GITHUB_SHA::7}

      # `rogue-agent` is a Worker with static assets (not a Pages project), so
      # this is `wrangler deploy` against wrangler.toml, which points [assets]
      # at build/web. Pull requests are built and tested but not deployed —
      # a Worker deploy goes straight to production.
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action defaults to wrangler 3.x, which predates stable
          # static-assets support.
          wranglerVersion: '4'
          command: deploy
